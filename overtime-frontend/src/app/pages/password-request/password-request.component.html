<div class="page" style="display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 64px)">
  <div class="card" style="width:100%;max-width:480px">
    <div class="card-title" style="display:flex;align-items:center;gap:8px">
      <mat-icon style="color:var(--primary)">lock_reset</mat-icon>
      Trocar Senha — {{ department }}
    </div>

    <div class="form-grid" style="gap:16px">
      <!-- Senha atual -->
      <div class="form-group">
        <label class="form-label">Senha Atual *</label>
        <div class="pw-field">
          <input [type]="showCurrent ? 'text' : 'password'"
                 class="form-control" placeholder="Digite sua senha atual"
                 [(ngModel)]="current" />
          <button class="pw-toggle" type="button" (click)="showCurrent = !showCurrent">
            <mat-icon class="icon-sm">{{ showCurrent ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <!-- Nova senha -->
      <div class="form-group">
        <label class="form-label">Nova Senha *</label>
        <div class="pw-field">
          <input [type]="showNew ? 'text' : 'password'"
                 class="form-control" placeholder="Mínimo 4 caracteres"
                 [(ngModel)]="newPw" />
          <button class="pw-toggle" type="button" (click)="showNew = !showNew">
            <mat-icon class="icon-sm">{{ showNew ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <!-- Confirmar -->
      <div class="form-group">
        <label class="form-label">Confirmar Nova Senha *</label>
        <div class="pw-field">
          <input [type]="showConfirm ? 'text' : 'password'"
                 class="form-control" placeholder="Repita a nova senha"
                 [(ngModel)]="confirm" />
          <button class="pw-toggle" type="button" (click)="showConfirm = !showConfirm">
            <mat-icon class="icon-sm">{{ showConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        @if (confirm && newPw && confirm !== newPw) {
          <div style="font-size:12px;color:var(--red);margin-top:4px;display:flex;align-items:center;gap:4px">
            <mat-icon class="icon-xs">error_outline</mat-icon> As senhas não coincidem
          </div>
        }
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-top:24px">
      <button class="btn btn-primary" (click)="submit()" [disabled]="loading">
        <mat-icon class="icon-sm">check_circle</mat-icon>
        {{ loading ? 'Salvando...' : 'Alterar Senha' }}
      </button>
    </div>
  </div>
</div>
