<div class="page">
  <div class="card">
    <div class="card-title">
      <mat-icon>key</mat-icon>
      Senhas de todos os departamentos
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      @for (dept of departments; track dept) {
        <div style="border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;background:var(--card)">

          <!-- Linha do departamento -->
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--elevated)">
            <div style="display:flex;align-items:center;gap:12px">
              <div class="avatar">{{ deptInitials(dept) }}</div>
              <span style="font-weight:600;font-size:14px;color:var(--heading)">{{ dept }}</span>
            </div>
            <button class="btn btn-sm"
                    [class.btn-outline]="!state[dept].open"
                    [class.btn-secondary]="state[dept].open"
                    (click)="toggle(dept)">
              @if (state[dept].open) {
                <mat-icon class="icon-sm">close</mat-icon> Cancelar
              } @else {
                <mat-icon class="icon-sm">key</mat-icon> Redefinir Senha
              }
            </button>
          </div>

          <!-- Formulário inline -->
          @if (state[dept].open) {
            <div style="padding:18px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:14px">
              <div class="form-grid form-grid-2" style="gap:12px">
                <div class="form-group">
                  <label class="form-label">Nova Senha</label>
                  <div class="pw-field">
                    <input [type]="state[dept].showNew ? 'text' : 'password'"
                           class="form-control" placeholder="Mínimo 4 caracteres"
                           [(ngModel)]="state[dept].newPw" />
                    <button class="pw-toggle" type="button" (click)="state[dept].showNew = !state[dept].showNew">
                      <mat-icon class="icon-sm">{{ state[dept].showNew ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Confirmar Senha</label>
                  <div class="pw-field">
                    <input [type]="state[dept].showConfirm ? 'text' : 'password'"
                           class="form-control" placeholder="Repita a senha"
                           [(ngModel)]="state[dept].confirm" />
                    <button class="pw-toggle" type="button" (click)="state[dept].showConfirm = !state[dept].showConfirm">
                      <mat-icon class="icon-sm">{{ state[dept].showConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                  </div>
                </div>
              </div>
              <div style="display:flex;justify-content:flex-end">
                <button class="btn btn-primary" (click)="save(dept)" [disabled]="state[dept].loading">
                  <mat-icon class="icon-sm">check_circle</mat-icon>
                  {{ state[dept].loading ? 'Salvando...' : 'Confirmar' }}
                </button>
              </div>
            </div>
          }

        </div>
      }
    </div>
  </div>
</div>
