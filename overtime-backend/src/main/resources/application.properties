# Server
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/overtimeos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway (database migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=*

# Logging
logging.level.com.overtimeos=DEBUG
logging.level.org.flywaydb=DEBUG

# Solides Integration
solides.api.url=https://app.solides.com/pt-BR/api/v1
solides.api.token=${SOLIDES_API_TOKEN}
solides.webhook.secret=${SOLIDES_WEBHOOK_SECRET}
# URL pública do ngrok (domínio fixo)
app.public-url=https://fermazon.ngrok.app